services:
  postgres:
    image: postgres:16-alpine
    container_name: phunda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phunda
      POSTGRES_PASSWORD: phunda
      POSTGRES_DB: phunda
    ports:
      - "5432:5432"
    volumes:
      - phunda_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phunda -d phunda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  phunda_pg_data:
